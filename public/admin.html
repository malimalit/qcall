<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>QCall Admin</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;padding:1.5rem}h1{color:#38bdf8;margin-bottom:1.5rem}.card{background:#1e293b;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}input,select{width:100%;padding:.7rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;margin-bottom:.8rem}.btn{padding:.6rem 1rem;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:.2rem}.bb{background:#38bdf8;color:#0f172a}.bg{background:#22c55e;color:#0f172a}.by{background:#fbbf24;color:#0f172a}.br{background:#ef4444;color:#fff}table{width:100%;border-collapse:collapse}th{background:#0f172a;padding:.7rem;text-align:left;color:#64748b}td{padding:.7rem;border-bottom:1px solid #334155}.badge{padding:.2rem .7rem;border-radius:20px;font-size:.8rem;font-weight:600}.ba{background:#22c55e;color:#0f172a}.bd{background:#fbbf24;color:#0f172a}.be{background:#ef4444;color:#fff}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:99}.modal.show{display:flex}.mbox{background:#1e293b;border-radius:12px;padding:2rem;width:90%;max-width:480px}</style></head><body><h1>QCall Admin</h1><div class="card"><h2 style="color:#94a3b8;margin-bottom:1rem">Add Client</h2><input id="n" placeholder="Name"/><input id="p" placeholder="Phone"/><input id="i" placeholder="Instance"/><input id="t" placeholder="Token"/><select id="pl"><option value="demo">Demo 7 days</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select><button class="btn bb" onclick="add()">Add Client</button></div><div class="card"><h2 style="color:#94a3b8;margin-bottom:1rem">Clients</h2><table><thead><tr><th>Name</th><th>Phone</th><th>Instance</th><th>Status</th><th>Expires</th><th>Actions</th></tr></thead><tbody id="tb"><tr><td colspan="6" style="color:#64748b">Loading...</td></tr></tbody></table></div><div class="modal" id="md"><div class="mbox"><h3 style="color:#38bdf8;margin-bottom:1rem">Edit Client</h3><input id="eid" type="hidden"/><input id="en" placeholder="Name"/><input id="ep" placeholder="Phone"/><input id="ei" placeholder="Instance"/><input id="et" placeholder="Token"/><select id="es"><option value="active">Active</option><option value="demo">Demo</option><option value="expired">Expired</option></select><input id="ex" type="date"/><div style="margin-top:1rem"><button class="btn bb" onclick="save()">Save</button><button class="btn br" onclick="cls()">Cancel</button></div></div></div><script>const P="Malit@1972";if(localStorage.getItem("a")!==P){const x=prompt("Password:");if(x!==P){document.body.innerHTML="<h2 style='color:red;padding:2rem'>Access Denied</h2>";}else localStorage.setItem("a",P);}async function load(){const r=await fetch("/api/clients");const d=await r.json();const tb=document.getElementById("tb");if(!d.clients||!d.clients.length){tb.innerHTML="<tr><td colspan=6 style='color:#64748b'>No clients</td></tr>";return;}tb.innerHTML=d.clients.map(c=>`<tr><td>${c.name}</td><td>${c.phone||"-"}</td><td>${c.instance||"-"}</td><td><span class="badge b${c.status[0]}">${c.status}</span></td><td>${c.expires_at?new Date(c.expires_at).toLocaleDateString():"-"}</td><td><button class="btn by" onclick="edit('${btoa(JSON.stringify(c))}')">Edit</button><button class="btn bg" onclick="demo('${c.id}')">Demo</button><button class="btn bb" onclick="act('${c.id}')">Activate</button><button class="btn br" onclick="del('${c.id}')">Del</button></td></tr>`).join("");}async function add(){const name=document.getElementById("n").value,phone=document.getElementById("p").value,instance=document.getElementById("i").value,token=document.getElementById("t").value,plan=document.getElementById("pl").value;if(!name||!instance||!token){alert("Name+Instance+Token required");return;}const r=await fetch("/api/clients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,instance,token,plan})});if((await r.json()).success){["n","p","i","t"].forEach(x=>document.getElementById(x).value="");load();alert("Done");}}function edit(e){const c=JSON.parse(atob(e));document.getElementById("eid").value=c.id;document.getElementById("en").value=c.name;document.getElementById("ep").value=c.phone||"";document.getElementById("ei").value=c.instance||"";document.getElementById("et").value=c.token||"";document.getElementById("es").value=c.status;document.getElementById("ex").value=c.expires_at?c.expires_at.split("T")[0]:"";document.getElementById("md").classList.add("show");}function cls(){document.getElementById("md").classList.remove("show");}async function save(){const id=document.getElementById("eid").value,name=document.getElementById("en").value,phone=document.getElementById("ep").value,instance=document.getElementById("ei").value,token=document.getElementById("et").value,status=document.getElementById("es").value,expires_at=document.getElementById("ex").value;await fetch("/api/clients/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,instance,token,status,expires_at})});cls();load();}async function demo(id){if(!confirm("7-day demo?"))return;await fetch("/api/clients/"+encodeURIComponent(id)+"/demo",{method:"POST"});load();alert("Demo activated");}async function act(id){const plan=prompt("monthly or yearly?","monthly");if(!plan)return;await fetch("/api/clients/"+encodeURIComponent(id)+"/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan})});load();alert("Activated");}async function del(id){if(!confirm("Delete?"))return;await fetch("/api/clients/"+id,{method:"DELETE"});load();}load();</script></body></html>
