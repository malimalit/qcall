<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCall Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:#1e293b;border-radius:16px;padding:2rem;width:100%;max-width:800px}
input,select{width:100%;padding:.8rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;font-size:.95rem;margin-bottom:.8rem}
.btn{padding:.8rem 1.2rem;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.9rem;color:white}
.b1{background:#1e40af;width:100%}
.b2{background:#166534}
.b3{background:#991b1b}
.b4{background:#92400e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat{background:#0f172a;border-radius:10px;padding:1rem;text-align:center}
.stat h2{font-size:2rem;color:#38bdf8}
.stat p{color:#94a3b8;font-size:.8rem}
.row{background:#0f172a;border-radius:10px;padding:1rem;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:700;display:inline-block}
.active{background:#14532d;color:#22c55e}
.expired{background:#450a0a;color:#ef4444}
h2{color:#38bdf8;margin-bottom:1.2rem}
h3{color:#38bdf8;margin-bottom:1rem;margin-top:1.5rem}
</style>
</head>
<body>
<div class="box" id="loginBox">
  <h2 style="text-align:center">QCall Admin</h2>
  <input type="password" id="pass" placeholder="Password" />
  <button class="btn b1" id="loginBtn">Login</button>
  <p id="err" style="color:#ef4444;text-align:center;margin-top:.5rem"></p>
</div>
<div class="box" id="mainBox" style="display:none">
  <h2>QCall Admin Dashboard</h2>
  <div class="stats">
    <div class="stat"><h2 id="sTotal">0</h2><p>Total</p></div>
    <div class="stat"><h2 id="sActive" style="color:#22c55e">0</h2><p>Active</p></div>
    <div class="stat"><h2 id="sExp" style="color:#ef4444">0</h2><p>Expired</p></div>
  </div>
  <h3>Add New Client</h3>
  <input type="text" id="cName" placeholder="Restaurant Name" />
  <input type="text" id="cPhone" placeholder="Phone e.g. +201001234567" />
  <input type="text" id="cInst" placeholder="UltraMsg Instance" />
  <input type="text" id="cTok" placeholder="UltraMsg Token" />
  <select id="cPlan">
    <option value="demo">Demo - 2 days</option>
    <option value="monthly">Monthly - 30 days</option>
    <option value="yearly">Yearly - 365 days</option>
  </select>
  <button class="btn b2" id="addBtn">Add Client</button>
  <p id="addMsg" style="text-align:center;margin-top:.5rem"></p>
  <h3>Clients</h3>
  <div id="list"></div>
</div>
<script>
var tok = "";
document.getElementById("loginBtn").onclick = function() {
  var p = document.getElementById("pass").value;
  fetch("/api/auth", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: p})})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.success){
      tok = p;
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("mainBox").style.display = "block";
      load();
    } else {
      document.getElementById("err").textContent = "Wrong password";
    }
  });
};
function load(){
  fetch("/api/admin/clients", {headers:{"x-admin-token": tok}})
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById("sTotal").textContent = d.stats.total;
    document.getElementById("sActive").textContent = d.stats.active;
    document.getElementById("sExp").textContent = d.stats.expired;
    var html = "";
    if(!d.clients.length) html = "<p style='color:#94a3b8;text-align:center'>No clients yet</p>";
    for(var i=0; i<d.clients.length; i++){
      var c = d.clients[i];
      var exp = new Date(c.expiresAt).toLocaleDateString();
      html += "<div class=\"row\"><div><strong>" + c.name + "</strong> <span class=\"badge " + c.status + "\">" + c.status + "</span><br><small style=\"color:#94a3b8\">" + c.phone + " | " + c.plan + " | " + exp + "</small></div>";
      html += "<div style=\"display:flex;gap:.5rem\"><button class=\"btn b4\" onclick=\"ext(this.dataset.id)\" data-id=\"" + c.id + "\">+30d</button> <button class=\"btn\" style=\"background:#1e40af\" onclick=\"editClient(this.dataset.id, this.dataset.name, this.dataset.phone, this.dataset.instance, this.dataset.token)\" data-id=\"" + c.id + "\" data-name=\"" + c.name + "\" data-phone=\"" + c.phone + "\" data-instance=\"" + c.instance + "\" data-token=\"" + c.token + "\">Edit</button> <button class=\"btn b3\" onclick=\"del(this.dataset.id)\" data-id=\"" + c.id + "\">Delete</button></div></div>";
    }
    document.getElementById("list").innerHTML = html;
  });
}
document.getElementById("addBtn").onclick = function(){
  var data = {
    name: document.getElementById("cName").value,
    phone: document.getElementById("cPhone").value,
    instance: document.getElementById("cInst").value,
    token: document.getElementById("cTok").value,
    plan: document.getElementById("cPlan").value
  };
  if(!data.name || !data.phone || !data.instance || !data.token){ alert("Fill all fields"); return; }
  fetch("/api/admin/clients", {method:"POST", headers:{"Content-Type":"application/json","x-admin-token":tok}, body: JSON.stringify(data)})
  .then(function(r){ return r.json(); })
  .then(function(d){
    var m = document.getElementById("addMsg");
    if(d.success){
      m.style.color = "#22c55e"; m.textContent = "Client added!";
      document.getElementById("cName").value = "";
      document.getElementById("cPhone").value = "";
      document.getElementById("cInst").value = "";
      document.getElementById("cTok").value = "";
      load();
    } else {
      m.style.color = "#ef4444"; m.textContent = "Error: " + d.error;
    }
  });
};
function ext(id){
  fetch("/api/admin/extend/" + id, {method:"POST", headers:{"Content-Type":"application/json","x-admin-token":tok}, body: JSON.stringify({days:30})})
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d.success){ alert("Extended 30 days!"); load(); } });
}
function del(id){
  if(!confirm("Delete this client?")) return;
  fetch("/api/admin/clients/" + id, {method:"DELETE", headers:{"x-admin-token":tok}})
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d.success) load(); });
}

function editClient(id, name, phone, instance, token) {
  document.getElementById('eName').value = name || '';
  document.getElementById('ePhone').value = phone || '';
  document.getElementById('eInstance').value = instance || '';
  document.getElementById('eToken').value = token || '';
  document.getElementById('eId').value = id;
  document.getElementById('editModal').style.display = 'flex';
}
function closeEdit() {
  document.getElementById('editModal').style.display = 'none';
}
function saveEdit() {
  var id = document.getElementById('eId').value;
  var name = document.getElementById('eName').value;
  var phone = document.getElementById('ePhone').value;
  var instance = document.getElementById('eInstance').value;
  var token = document.getElementById('eToken').value;
  fetch('/api/clients/' + id, {
    method: 'PUT',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+tok},
    body: JSON.stringify({name:name, phone:phone, instance:instance, token:token})
  }).then(function(r){ return r.json(); }).then(function(d){
    closeEdit();
    loadClients();
  });
}
</script>

<div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1e293b;border-radius:16px;padding:2rem;width:90%;max-width:400px;">
    <h3 style="color:#38bdf8;margin-bottom:1rem">Edit Client</h3>
    <input type="hidden" id="eId">
    <input type="text" id="eName" placeholder="Name" style="width:100%;padding:.8rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;margin-bottom:.8rem"><br>
    <input type="text" id="ePhone" placeholder="Phone" style="width:100%;padding:.8rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;margin-bottom:.8rem"><br>
    <input type="text" id="eInstance" placeholder="UltraMsg Instance" style="width:100%;padding:.8rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;margin-bottom:.8rem"><br>
    <input type="text" id="eToken" placeholder="UltraMsg Token" style="width:100%;padding:.8rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;margin-bottom:.8rem"><br>
    <div style="display:flex;gap:.8rem">
      <button onclick="saveEdit()" style="flex:1;padding:.8rem;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer">Save</button>
      <button onclick="closeEdit()" style="flex:1;padding:.8rem;background:#dc2626;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>
</body>
</html>
