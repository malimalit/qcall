<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QCall - Your Order</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
    .card{background:#1e293b;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
    .order-number{font-size:4rem;font-weight:800;color:#38bdf8}
    .status-text{font-size:1.4rem;font-weight:600;color:#94a3b8}
    .status-text.ready{color:#22c55e}
    .spinner{width:50px;height:50px;border:5px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ack-btn{display:none;width:100%;padding:1.2rem;background:#22c55e;color:#0f172a;border:none;border-radius:14px;font-size:1.2rem;font-weight:700;cursor:pointer}
    .sound-btn{width:100%;padding:.8rem;background:#1e40af;color:white;border:none;border-radius:10px;font-size:1rem;cursor:pointer;margin-top:.5rem}
    .not-found{color:#ef4444}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .pulse{animation:pulse 1.5s infinite}
  </style>
</head>
<body>
<div class="card">
  <div class="order-number" id="orderNum">—</div>
  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="statusText">Connecting...</div>
  <button class="sound-btn" id="soundBtn" onclick="enableSound()">🔔 Tap to enable sound</button>
  <button class="ack-btn" id="ackBtn">✅ Got it! I'm on my way</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
  const params=new URLSearchParams(window.location.search);
  const orderId=params.get('orderId');
  const orderNum=document.getElementById('orderNum');
  const spinner=document.getElementById('spinner');
  const statusText=document.getElementById('statusText');
  const ackBtn=document.getElementById('ackBtn');
  const soundBtn=document.getElementById('soundBtn');
  let audioCtx=null;
  let soundEnabled=false;

  function enableSound(){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    soundEnabled=true;
    soundBtn.textContent='🔔 Sound enabled!';
    soundBtn.style.background='#166534';
    setTimeout(()=>{soundBtn.style.display='none';},1500);
  }

  if(!orderId){
    orderNum.textContent='?';
    spinner.style.display='none';
    soundBtn.style.display='none';
    statusText.textContent='No order found. Please scan again.';
    statusText.classList.add('not-found');
  } else {
    orderNum.textContent='#'+orderId;
    const socket=io();

    socket.on('connect',()=>{
      statusText.textContent='Waiting for your order...';
      socket.emit('join_order',{orderId});
    });

    socket.on('connect_error',()=>{
      spinner.style.display='none';
      statusText.textContent='Connection error. Please refresh.';
    });

    socket.on('order_status',({status})=>{
      if(status==='READY')showReady();
      else if(status==='NOT_FOUND'){
        spinner.style.display='none';
        soundBtn.style.display='none';
        statusText.textContent='Order not found. Please ask the cashier.';
        statusText.classList.add('not-found');
      } else {
        spinner.style.display='block';
        statusText.textContent='Your order is being prepared...';
      }
    });

    socket.on('order_ready',()=>showReady());

    function showReady(){
      spinner.style.display='none';
      soundBtn.style.display='none';
      statusText.textContent='🎉 Your order is ready!';
      statusText.classList.add('ready');
      ackBtn.style.display='block';
      ackBtn.classList.add('pulse');
      playSound();
    }

    ackBtn.addEventListener('click',()=>{
      socket.emit('order_acknowledged',{orderId});
      ackBtn.style.display='none';
      statusText.textContent='Great! Please pick up your order.';
      statusText.classList.remove('ready');
    });

    function playSound(){
      if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
      audioCtx.resume().then(()=>{
        [523,659,784,1047,784,1047].forEach((freq,i)=>{
          const osc=audioCtx.createOscillator();
          const gain=audioCtx.createGain();
          osc.connect(gain);gain.connect(audioCtx.destination);
          osc.frequency.value=freq;osc.type='sine';
          gain.gain.setValueAtTime(0.6,audioCtx.currentTime+i*0.25);
          gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(i+1)*0.25);
          osc.start(audioCtx.currentTime+i*0.25);
          osc.stop(audioCtx.currentTime+(i+1)*0.25);
        });
      });
    }
  }
</script>
</body>
</html>
