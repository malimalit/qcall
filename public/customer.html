<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QCall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.card{background:#1e293b;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.order-number{font-size:4rem;font-weight:800;color:#38bdf8}
.status-text{font-size:1.4rem;font-weight:600;color:#94a3b8}
.spinner{width:50px;height:50px;border:5px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.allow-btn{width:100%;padding:1rem;background:#1e40af;color:white;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer}
.allow-btn.done{background:#166534}
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
.popup-box{background:#14532d;border:3px solid #22c55e;border-radius:24px;padding:2.5rem 2rem;width:90%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:1.2rem;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.popup-icon{font-size:4rem}
.popup-title{font-size:2rem;font-weight:800;color:#22c55e}
.popup-msg{font-size:1.1rem;color:#bbf7d0;line-height:1.5}
.popup-btn{width:100%;padding:1.2rem;background:#22c55e;color:#0f172a;border:none;border-radius:14px;font-size:1.2rem;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="order-number" id="orderNum">—</div>
  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="statusText">Connecting...</div>
  <button class="allow-btn" id="allowBtn" onclick="enableSound()">🔔 Allow Sound & Notifications</button>
</div>
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon">🎉</div>
    <div class="popup-title">Order Ready!</div>
    <div class="popup-msg" id="popupMsg">Your order is waiting at the counter!</div>
    <button class="popup-btn" onclick="dismissPopup()">✅ Got it! I'm on my way</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const orderId = params.get('orderId');
const orderNumEl = document.getElementById('orderNum');
const spinnerEl = document.getElementById('spinner');
const statusEl = document.getElementById('statusText');
const allowBtn = document.getElementById('allowBtn');
const overlay = document.getElementById('popupOverlay');
let audioCtx = null;
let soundInterval = null;
let soundEnabled = false;
let pendingReady = false;

function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx.resume();
}

function playTone(freq, start, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = freq; osc.type = 'sine';
  gain.gain.setValueAtTime(0.8, audioCtx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+start+dur);
  osc.start(audioCtx.currentTime+start);
  osc.stop(audioCtx.currentTime+start+dur);
}

function playReady(){
  if(!audioCtx) return;
  audioCtx.resume().then(()=>{
    [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.2,0.2));
  });
}

async function enableSound(){
  allowBtn.disabled = true;
  allowBtn.textContent = '⏳ Setting up...';
  try {
    await initAudio();
    playTone(880, 0, 0.2);
    soundEnabled = true;
  } catch(e){}
  allowBtn.textContent = '✅ Sound enabled!';
  allowBtn.classList.add('done');
  if(pendingReady) showPopup();
}

function showPopup(){
  if(!soundEnabled){ pendingReady = true; return; }
  pendingReady = false;
  spinnerEl.style.display = 'none';
  statusEl.textContent = '🎉 Your order is ready!';
  statusEl.style.color = '#22c55e';
  overlay.style.display = "flex"; overlay.style.setProperty("display","flex","important"); alert("🎉 Order Ready! Please come pick up your order.");
  playReady();
  if(soundInterval) clearInterval(soundInterval);
  soundInterval = setInterval(playReady, 4000);
}

function dismissPopup(){
  overlay.style.display = 'none';
  if(soundInterval){ clearInterval(soundInterval); soundInterval = null; }
  statusEl.textContent = 'Great! Please pick up your order 🙌';
  statusEl.style.color = '#94a3b8';
}

if(!orderId){
  orderNumEl.textContent = '?';
  spinnerEl.style.display = 'none';
  allowBtn.style.display = 'none';
  statusEl.textContent = 'No order found.';
} else {
  orderNumEl.textContent = '#'+orderId;
  const socket = io({ transports: ['polling','websocket'] });

  socket.on('connect', ()=>{
    statusEl.textContent = 'Waiting for your order...';
    socket.emit('join_order', { orderId });
  });

  socket.on('order_status', ({status})=>{
    if(status==='READY') showPopup();
    else if(status==='NOT_FOUND'){
      spinnerEl.style.display='none';
      allowBtn.style.display='none';
      statusEl.textContent='Order not found.';
    }
  });

  socket.on('order_ready', ()=> showPopup());

  socket.on('disconnect', ()=>{
    // reconnect automatically
    setTimeout(()=> socket.connect(), 2000);
  });
}

document.addEventListener('touchstart',()=>{
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }
},{once:true});
</script>
</body>
</html>
