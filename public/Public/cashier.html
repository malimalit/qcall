<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QCall - Cashier</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 1.5rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 1.8rem; color: #38bdf8; }
    header span { font-size: 0.9rem; color: #64748b; }
    .new-order-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      background: #38bdf8;
      color: #0f172a;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: opacity 0.2s;
    }
    .new-order-btn:hover { opacity: 0.85; }
    .qr-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 1rem;
    }
    .qr-popup.show { display: flex; }
    .qr-popup img {
      width: 260px;
      height: 260px;
      border-radius: 16px;
      background: white;
      padding: 1rem;
    }
    .qr-popup h2 { font-size: 1.5rem; color: #38bdf8; }
    .qr-popup p { color: #94a3b8; font-size: 1rem; }
    .qr-popup button {
      padding: 0.8rem 2rem;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .order-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      border: 2px solid transparent;
    }
    .order-card.ready { border-color: #22c55e; }
    .order-number { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
    .order-time { font-size: 0.85rem; color: #64748b; }
    .status-badge {
      padding: 0.3rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-badge.preparing { background: #fbbf24; color: #0f172a; }
    .status-badge.ready { background: #22c55e; color: #0f172a; }
    .call-btn {
      width: 100%;
      padding: 0.7rem;
      background: #22c55e;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .call-btn:hover { opacity: 0.85; }
    .call-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: default;
    }
    .empty { text-align: center; color: #475569; padding: 3rem; font-size: 1.1rem; }
  </style>
</head>
<body>
<header>
  <h1>⚡ QCall — Cashier</h1>
  <span id="orderCount">0 active orders</span>
</header>

<button class="new-order-btn" onclick="createOrder()">+ New Order</button>

<div id="ordersGrid" class="orders-grid">
  <p class="empty">No active orders yet.</p>
</div>

<div class="qr-popup" id="qrPopup">
  <h2>Order <span id="popupOrderId"></span></h2>
  <img id="popupQR" src="" alt="QR Code"/>
  <p>Show this QR to the customer to scan</p>
  <button onclick="closeQR()">Close</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  socket.on('orders_updated', (orders) => renderOrders(orders));

  async function createOrder() {
    const res = await fetch('/api/orders/create', { method: 'POST' });
    const data = await res.json();
    if (data.success) showQR(data.orderId, data.qrCodeDataUrl);
  }

  async function callOrder(orderId) {
    await fetch('/api/orders/call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId })
    });
  }

  function showQR(orderId, qrDataUrl) {
    document.getElementById('popupOrderId').textContent = `#${orderId}`;
    document.getElementById('popupQR').src = qrDataUrl;
    document.getElementById('qrPopup').classList.add('show');
  }

  function closeQR() {
    document.getElementById('qrPopup').classList.remove('show');
  }

  function renderOrders(orders) {
    const grid = document.getElementById('ordersGrid');
    const count = document.getElementById('orderCount');
    count.textContent = `${orders.length} active order${orders.length !== 1 ? 's' : ''}`;

    if (!orders.length) {
      grid.innerHTML = '<p class="empty">No active orders yet.</p>';
      return;
    }

    grid.innerHTML = orders.map(order => `
      <div class="order-card ${order.status === 'READY' ? 'ready' : ''}">
        <div class="order-number">#${order.orderId}</div>
        <div class="order-time">${order.createdAt}</div>
        <span class="status-badge ${order.status === 'READY' ? 'ready' : 'preparing'}">
          ${order.status === 'READY' ? 'Ready' : 'Preparing'}
        </span>
        <button class="call-btn"
          onclick="callOrder('${order.orderId}')"
          ${order.status === 'READY' ? 'disabled' : ''}>
          ${order.status === 'READY' ? 'Called ✓' : 'Call Customer'}
        </button>
      </div>
    `).join('');
  }

  fetch('/api/orders/list')
    .then(r => r.json())
    .then(data => renderOrders(data.orders));
</script>
</body>
</html>
