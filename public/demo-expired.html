<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCall - Trial Ended</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
.card{background:#1e293b;border-radius:20px;padding:2.5rem 2rem;max-width:420px;width:100%}
.icon{font-size:4rem;margin-bottom:1rem}
h1{color:#ef4444;font-size:1.8rem;margin-bottom:.5rem}
p{color:#94a3b8;margin-bottom:1.5rem;line-height:1.6}
.plans{display:grid;gap:1rem;margin-bottom:1.5rem}
.plan{background:#0f172a;border-radius:12px;padding:1.2rem;border:1px solid #334155}
.plan h3{color:#38bdf8;margin-bottom:.3rem}
.plan p{color:#94a3b8;font-size:.9rem;margin:0}
.plan .price{color:#f1f5f9;font-size:1.3rem;font-weight:800;margin:.3rem 0}
.btn{display:block;width:100%;padding:1rem;background:#22c55e;color:#0f172a;border:none;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="icon">⏰</div>
  <h1>Trial Ended</h1>
  <p>Your QCall trial has expired. Upgrade to keep using QCall and never miss a customer order.</p>
  <div class="plans">
    <div class="plan">
      <h3>Monthly</h3>
      <div class="price">199 EGP/mo</div>
      <p>Full access, all features</p>
    </div>
    <div class="plan">
      <h3>Yearly</h3>
      <div class="price">1,499 EGP/yr</div>
      <p>Save 37% - Best value</p>
    </div>
  </div>
  <a class="btn" href="https://wa.me/201554005048?text=I want to subscribe to QCall">Contact us on WhatsApp</a>
</div>
</body>
</html>
