<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QCall - Archive</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding:1.5rem}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
    header h1{font-size:1.8rem;color:#38bdf8}
    .back-btn{padding:.6rem 1.2rem;background:#1e293b;color:#94a3b8;border:none;border-radius:10px;font-size:.9rem;cursor:pointer;text-decoration:none}
    .clear-btn{padding:.6rem 1.2rem;background:#ef4444;color:white;border:none;border-radius:10px;font-size:.9rem;cursor:pointer}
    table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:14px;overflow:hidden}
    th{background:#0f172a;padding:1rem;text-align:left;color:#64748b;font-size:.85rem}
    td{padding:1rem;border-top:1px solid #0f172a;font-size:.95rem}
    .empty{text-align:center;color:#475569;padding:3rem;font-size:1.1rem}
    .order-num{color:#38bdf8;font-weight:700}
  </style>
</head>
<body>
<header>
  <h1>📁 Archive</h1>
  <div style="display:flex;gap:.8rem">
    <a href="/cashier.html" class="back-btn">← Back to Cashier</a>
    <button class="clear-btn" onclick="clearArchive()">Clear All</button>
  </div>
</header>
<div id="content"></div>
<script>
  function loadArchive() {
    const archive = JSON.parse(localStorage.getItem('qcall_archive') || '[]');
    const content = document.getElementById('content');
    if (!archive.length) {
      content.innerHTML = '<p class="empty">No archived orders yet.</p>';
      return;
    }
    content.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Created</th>
            <th>Completed</th>
          </tr>
        </thead>
        <tbody>
          ${archive.reverse().map(o => `
            <tr>
              <td class="order-num">#${o.orderId}</td>
              <td>${o.createdAt}</td>
              <td>${o.completedAt}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function clearArchive() {
    if (confirm('Clear all archived orders?')) {
      localStorage.removeItem('qcall_archive');
      loadArchive();
    }
  }

  loadArchive();
</script>
</body>
</html>
