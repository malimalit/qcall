<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QCall - Your Order</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }
    .order-number {
      font-size: 4rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .status-text {
      font-size: 1.4rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .status-text.ready { color: #22c55e; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ack-btn {
      display: none;
      width: 100%;
      padding: 1.2rem;
      background: #22c55e;
      color: #0f172a;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .ack-btn:hover { opacity: 0.85; }
    .not-found { color: #ef4444; font-size: 1.1rem; }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="order-number" id="orderNum">—</div>
  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="statusText">Connecting...</div>
  <button class="ack-btn" id="ackBtn">✅ Got it! I'm on my way</button>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');

  const orderNum = document.getElementById('orderNum');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('statusText');
  const ackBtn = document.getElementById('ackBtn');

  if (!orderId) {
    orderNum.textContent = '?';
    spinner.style.display = 'none';
    statusText.textContent = 'No order found. Please scan again.';
    statusText.classList.add('not-found');
  } else {
    orderNum.textContent = `#${orderId}`;

    const socket = io();

    socket.on('connect', () => {
      socket.emit('join_order', { orderId });
    });

    socket.on('order_status', ({ status }) => {
      if (status === 'READY') {
        showReady();
      } else if (status === 'NOT_FOUND') {
        spinner.style.display = 'none';
        statusText.textContent = 'Order not found. Please ask the cashier.';
        statusText.classList.add('not-found');
      } else {
        spinner.style.display = 'block';
        statusText.textContent = 'Your order is being prepared...';
      }
    });

    socket.on('order_ready', () => showReady());

    function showReady() {
      spinner.style.display = 'none';
      statusText.textContent = '🎉 Your order is ready!';
      statusText.classList.add('ready');
      ackBtn.style.display = 'block';
      ackBtn.classList.add('pulse');
      playSound();

      if ('Notification' in window && Notification.permission === 'granted') {
        const notification = new Notification(`Order #${orderId} is Ready! 🎉`, {
          body: 'Tap to view your order and head to the counter.',
          requireInteraction: true
        });
        notification.onclick = function() {
          window.focus();
          notification.close();
        };
      }
    }

    ackBtn.addEventListener('click', () => {
      socket.emit('order_acknowledged', { orderId });
      ackBtn.style.display = 'none';
      statusText.textContent = 'Great! Please pick up your order.';
      statusText.classList.remove('ready');
    });

    function playSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523, 659, 784, 1047, 784, 1047];
        const duration = 0.25;
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.5, ctx.currentTime + i * duration);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i + 1) * duration);
          osc.start(ctx.currentTime + i * duration);
          osc.stop(ctx.currentTime + (i + 1) * duration);
        });
      } catch (e) {
        console.log("Audio playback blocked.");
      }
    }

    // Initialize Firebase Messaging & Register Token for Background Push
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('Service Worker registered!');
          
          firebase.initializeApp({
            apiKey: "AIzaSyAqSil0vbir0TklpqAORr5ZIh6RKbwmtZk",
            authDomain: "qcall-e1ec9.firebaseapp.com",
            projectId: "qcall-e1ec9",
            storageBucket: "qcall-e1ec9.firebasestorage.app",
            messagingSenderId: "775125377549",
            appId: "1:775125377549:web:1de5c4eb8c706bf7fceb44"
          });

          const messaging = firebase.messaging();

          Notification.requestPermission().then((permission) => {
            if (permission === 'granted') {
              messaging.getToken({ serviceWorkerRegistration: registration }).then((currentToken) => {
                if (currentToken) {
                  socket.emit('register_token', { orderId, token: currentToken });
                }
              }).catch((err) => {
                console.log('Error retrieving token:', err);
              });
            }
          });
        })
        .catch((err) => {
          console.log('Service Worker registration failed:', err);
        });
    }
  }
</script>
</body>
</html>
