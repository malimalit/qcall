<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCall Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: #38bdf8; }
    .card { background: #1e293b; padding: 2rem; border-radius: 16px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 1rem; font-size: 1.25rem; color: #cbd5e1; }
    .form-grid { display: flex; flex-direction: column; gap: 1rem; }
    input, select {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button {
      padding: 0.8rem 1.5rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; overflow-x: auto; display: block; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #334155; white-space: nowrap; }
    th { color: #94a3b8; font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
    .badge.active { background: #22c55e; color: #0f172a; }
    .badge.demo { background: #eab308; color: #0f172a; }
    .empty-state { text-align: center; color: #64748b; padding: 2rem; }
  </style>
</head>
<body>

  <h1>QCall Admin</h1>

  <div class="card">
    <h2>Add Client</h2>
    <form id="clientForm" class="form-grid">
      <input type="text" id="clientName" placeholder="Name" required>
      <input type="text" id="clientPhone" placeholder="Phone" required>
      <input type="text" id="clientInstance" placeholder="Instance" required>
      <input type="text" id="clientToken" placeholder="Token" required>
      <select id="clientPlan">
        <option value="Demo 7 days">Demo 7 days</option>
        <option value="Monthly">Monthly</option>
        <option value="Yearly">Yearly</option>
      </select>
      <button type="submit">Add Client</button>
    </form>
  </div>

  <div class="card">
    <h2>Clients</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Instance</th>
          <th>Status</th>
          <th>Expires</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="clientTableBody">
        <tr><td colspan="6" class="empty-state">No clients</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const clientForm = document.getElementById('clientForm');
    const clientTableBody = document.getElementById('clientTableBody');

    let clients = [];

    async function fetchClients() {
      try {
        const response = await fetch('/api/clients');
        const data = await response.json();
        if (data.success && Array.isArray(data.clients)) {
          clients = data.clients;
          renderClients();
        }
      } catch (e) {
        console.error("Error fetching clients from server", e);
      }
    }

    function renderClients() {
      if (!clients || clients.length === 0) {
        clientTableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No clients</td></tr>`;
        return;
      }

      clientTableBody.innerHTML = clients.map((c, index) => `
        <tr>
          <td>${c.name}</td>
          <td>${c.phone}</td>
          <td>${c.instance}</td>
          <td><span class="badge ${c.plan && c.plan.includes('Demo') ? 'demo' : 'active'}">${c.plan || 'Active'}</span></td>
          <td>${c.expires || '-'}</td>
          <td><button type="button" onclick="deleteClient('${c.id}')" style="background:#ef4444; color:#fff; padding:0.4rem 0.8rem; font-size:0.85rem; border:none; border-radius:6px; cursor:pointer;">Delete</button></td>
        </tr>
      `).join('');
    }

    clientForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('clientName').value;
      const phone = document.getElementById('clientPhone').value;
      const instance = document.getElementById('clientInstance').value;
      const token = document.getElementById('clientToken').value;
      const plan = document.getElementById('clientPlan').value;

      const expiryDate = new Date();
      if (plan === 'Demo 7 days') expiryDate.setDate(expiryDate.getDate() + 7);
      else if (plan === 'Monthly') expiryDate.setMonth(expiryDate.getMonth() + 1);
      else if (plan === 'Yearly') expiryDate.setFullYear(expiryDate.getFullYear() + 1);

      try {
        const response = await fetch('/api/clients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name, 
            phone, 
            instance, 
            token, 
            plan, 
            expires: expiryDate.toLocaleDateString() 
          })
        });

        const result = await response.json();
        if (!result.success) {
          throw new Error(result.error || 'Failed to save client');
        }

        clientForm.reset();
        fetchClients(); // Refresh table from database
      } catch (err) {
        console.error("Error saving client:", err);
        alert('Error adding client: ' + err.message);
      }
    });

    window.deleteClient = async function(id) {
      if (!confirm('Are you sure you want to delete this client?')) return;
      try {
        const response = await fetch(`/api/clients/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          fetchClients();
        } else {
          alert('Failed to delete client');
        }
      } catch (err) {
        console.error('Error deleting client:', err);
      }
    }

    // Load initial list on page load
    fetchClients();
  </script>
</body>
</html>
