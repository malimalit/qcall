<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call | Cashier Control Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(180deg, #eef6ff, #f4f4f9); padding: 20px; }
        .card { background: white; padding: 28px; border-radius: 18px; max-width: 560px; margin: auto; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12); }
        .brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; background: #e0f2fe; color: #075985; border-radius: 999px; padding: 8px 12px; font-size: 0.8rem; font-weight: 700; }
        h2 { margin-top: 0; font-size: clamp(1.7rem, 2vw, 2.3rem); }
        .subtext { margin: 0 0 20px; color: #4b5563; line-height: 1.6; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        button.call-btn { background: #007bff; }
        input, select { width: 100%; padding: 12px 14px; margin-top: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; }
        .qr-preview { text-align: center; margin-top: 22px; }
        img { width: 180px; height: 180px; }
        .meta { margin-bottom: 8px; color: #4b5563; font-weight: 700; }
        hr { margin: 24px 0; border: none; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand brand-with-logo"><img src="https://cdn.quickress.com/logo/19_17785102243971.jpeg" alt="Daily Sips logo" class="mini-brand-logo"> Daily Sips</div>
        <h2>Cashier Order Panel</h2>
        <p class="subtext">A clean, standalone order-ready system that works without connecting to the buyer’s existing cashier interface.</p>

        <div class="meta">Outlet name</div>
        <input type="text" id="outletName" value="Daily Sips" placeholder="Daily Sips"> 
        <select id="outletType" style="margin-top: 12px;">
            <option value="restaurant">Restaurant</option>
            <option value="cafe">Cafe</option>
        </select>
        <button onclick="createNewOrder()">➕ Generate Next Order QR</button>
        
        <div id="qrResult" class="qr-preview" style="display:none;">
            <h3>Active Order: <span id="displayOrderId"></span></h3>
            <img id="qrImage" src="" alt="QR Code">
        </div>
        const trackingUrl = `https://fancy-wolves-make.loca.lt/track.html?orderId=${orderId}`;
 
        <h3>Call Ready Order</h3>
        <input type="number" id="callOrderId" placeholder="Enter Order # (e.g. 101)">
        <button class="call-btn" onclick="callOrder()">🔔 Call Client (Beep Mobile)</button>
    </div>
 
    <script>
        async function createNewOrder() {
            const outletName = document.getElementById('outletName').value.trim() || 'Call Demo';
            const outletType = document.getElementById('outletType').value || 'restaurant';

            const res = await fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ outletName, outletType })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('displayOrderId').innerText = '#' + data.orderId;
                document.getElementById('qrImage').src = data.qrCodeDataUrl;
                document.getElementById('qrResult').style.display = 'block';
            }
        }

        async function callOrder() {
            const orderId = document.getElementById('callOrderId').value;
            if(!orderId) return alert('Please enter an order number');
            
            const res = await fetch('/api/orders/call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId })
            });
            const data = await res.json();
            alert(data.message);
        }
    </script>
</body>
</html>
