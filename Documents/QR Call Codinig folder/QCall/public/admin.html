<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCall - Master Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: #38bdf8; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    button { padding: 0.6rem 1.2rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    .badge.active { background: #22c55e; color: #0f172a; }
    .badge.demo { background: #eab308; color: #0f172a; }
  </style>
</head>
<body>

  <h1>⚡ QCall Master Admin Panel</h1>

  <div class="card">
    <h2>Add New Client / Demo</h2>
    <form id="clientForm" style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
      <input type="text" id="bizName" placeholder="Business Name" required style="padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; flex: 1;">
      <input type="email" id="ownerEmail" placeholder="Owner Email" required style="padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; flex: 1;">
      <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="isDemo"> Is Demo?</label>
      <button type="submit">Add Client</button>
    </form>
  </div>

  <div class="card">
    <h2>Active Software Clients</h2>
    <table>
      <thead>
        <tr>
          <th>Business Name</th>
          <th>Email</th>
          <th>Type</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="clientTableBody">
        <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Loading clients...</td></tr>
      </tbody>
    </table>
  </div>

</body>
</html>
