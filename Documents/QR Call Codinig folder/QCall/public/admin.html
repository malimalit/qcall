<script>
    const clientForm = document.getElementById('clientForm');
    const clientTableBody = document.getElementById('clientTableBody');

    let clients = [];
    try {
      clients = JSON.parse(localStorage.getItem('qcall_clients') || '[]');
    } catch (e) {
      console.error("Error reading localStorage", e);
    }

    function renderClients() {
      if (!clients || clients.length === 0) {
        clientTableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No clients</td></tr>`;
        return;
      }

      clientTableBody.innerHTML = clients.map((c, index) => `
        <tr>
          <td>${c.name}</td>
          <td>${c.phone}</td>
          <td>${c.instance}</td>
          <td><span class="badge ${c.plan && c.plan.includes('Demo') ? 'demo' : 'active'}">${c.plan || 'Active'}</span></td>
          <td>${c.expires || '-'}</td>
          <td><button onclick="deleteClient(${index})" style="background:#ef4444; color:#fff; padding:0.4rem 0.8rem; font-size:0.85rem; border:none; border-radius:6px; cursor:pointer;">Delete</button></td>
        </tr>
      `).join('');
    }

    clientForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('clientName').value;
      const phone = document.getElementById('clientPhone').value;
      const instance = document.getElementById('clientInstance').value;
      const token = document.getElementById('clientToken').value;
      const plan = document.getElementById('clientPlan').value;

      const expiryDate = new Date();
      if (plan === 'Demo 7 days') expiryDate.setDate(expiryDate.getDate() + 7);
      else if (plan === 'Monthly') expiryDate.setMonth(expiryDate.getMonth() + 1);
      else if (plan === 'Yearly') expiryDate.setFullYear(expiryDate.getFullYear() + 1);

      clients.push({
        name,
        phone,
        instance,
        token,
        plan,
        expires: expiryDate.toLocaleDateString()
      });

      try {
        localStorage.setItem('qcall_clients', JSON.stringify(clients));
      } catch (err) {
        console.error("Error saving to localStorage", err);
      }

      clientForm.reset();
      renderClients();
    });

    window.deleteClient = function(index) {
      clients.splice(index, 1);
      localStorage.setItem('qcall_clients', JSON.stringify(clients));
      renderClients();
    }

    renderClients();
  </script>
